<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول — ميسورة</title>
  <link rel="icon" type="image/jpeg" href="/logo-dark.jpeg" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg, #0a0f16);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 2rem 1.75rem;
    }
    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .login-logo img {
      height: 56px;
      border-radius: 12px;
    }
    .login-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 1.5rem;
      gap: 0;
    }
    .login-tab {
      flex: 1;
      padding: 0.65rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #8b949e;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .login-tab.active {
      color: #e2e8f0;
      border-bottom-color: #8b58e0;
    }
    .login-form { display: flex; flex-direction: column; gap: 0.85rem; }
    .login-input {
      width: 100%;
      background: #161b22;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #e2e8f0;
      padding: 0.7rem 0.9rem;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      direction: rtl;
      box-sizing: border-box;
    }
    .login-input:focus { border-color: rgba(139,88,224,0.5); }
    .login-input::placeholder { color: #484f58; }
    .role-select {
      appearance: none;
      -webkit-appearance: none;
    }
    .login-submit {
      width: 100%;
      margin-top: 0.4rem;
    }
    .login-msg {
      font-size: 0.88rem;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .login-msg--error {
      background: rgba(248,81,73,0.1);
      border: 1px solid rgba(248,81,73,0.3);
      color: #f85149;
    }
    .login-msg--success {
      background: rgba(46,160,67,0.1);
      border: 1px solid rgba(46,160,67,0.3);
      color: #2ea043;
    }
    .login-footer {
      text-align: center;
      margin-top: 1.25rem;
      color: #8b949e;
      font-size: 0.85rem;
    }
    .login-footer a { color: #c9b3f5; text-decoration: none; }
    .login-footer a:hover { text-decoration: underline; }
    .panel { background: #0d1117; border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; }
  </style>
</head>
<body class="page login-page">

  <div class="login-card panel">
    <div class="login-logo">
      <img src="/logo-dark.jpeg" alt="ميسورة" />
    </div>

    <!-- TABS -->
    <div class="login-tabs">
      <button class="login-tab active" id="tab-login" onclick="switchTab('login')">تسجيل الدخول</button>
      <button class="login-tab" id="tab-signup" onclick="switchTab('signup')">حساب جديد</button>
    </div>

    <!-- LOGIN FORM -->
    <form class="login-form" id="form-login">
      <input type="email" class="login-input" id="login-email" placeholder="البريد الإلكتروني" required />
      <input type="password" class="login-input" id="login-password" placeholder="كلمة المرور" required />
      <div class="login-msg login-msg--error" id="login-error"></div>
      <button type="submit" class="btn btn-primary login-submit">دخول ←</button>
    </form>

    <!-- SIGN UP FORM -->
    <form class="login-form" id="form-signup" style="display:none">
      <input type="text" class="login-input" id="signup-name" placeholder="الاسم" required />
      <input type="email" class="login-input" id="signup-email" placeholder="البريد الإلكتروني" required />
      <input type="password" class="login-input" id="signup-password" placeholder="كلمة المرور (٨ أحرف على الأقل)" minlength="8" required />
      <select class="login-input role-select" id="signup-role">
        <option value="student">طالب</option>
        <option value="teacher">معلم / ولي أمر</option>
      </select>
      <div class="login-msg login-msg--error" id="signup-error"></div>
      <div class="login-msg login-msg--success" id="signup-success"></div>
      <button type="submit" class="btn btn-primary login-submit">إنشاء الحساب ←</button>
    </form>

    <div class="login-footer">
      <a href="/">← العودة للرئيسية</a>
    </div>
  </div>

  <script>
    // ---- Supabase init (fetched from backend to avoid hardcoding) ----
    let supabase = null;

    async function initSupabase() {
      try {
        const res = await fetch('/config/supabase');
        const cfg = await res.json();
        if (!cfg.url || !cfg.anon_key) {
          showMsg('login-error', 'خدمة المصادقة غير مهيأة بعد.');
          return;
        }
        supabase = window.supabase.createClient(cfg.url, cfg.anon_key);
      } catch (e) {
        showMsg('login-error', 'تعذّر الاتصال بخادم المصادقة.');
      }
    }

    // ---- UI helpers ----
    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
      document.getElementById('form-login').style.display = tab === 'login' ? 'flex' : 'none';
      document.getElementById('form-signup').style.display = tab === 'signup' ? 'flex' : 'none';
    }

    function showMsg(id, text) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.style.display = 'block';
    }

    function hideMsg(id) {
      document.getElementById(id).style.display = 'none';
    }

    function setLoading(btn, on) {
      btn.disabled = on;
      btn.textContent = on ? 'جارٍ التحميل...' : (btn.dataset.orig || btn.textContent);
      if (!on && !btn.dataset.orig) btn.dataset.orig = btn.textContent;
    }

    // ---- Login ----
    document.getElementById('form-login').addEventListener('submit', async e => {
      e.preventDefault();
      if (!supabase) return;
      hideMsg('login-error');
      const btn = e.target.querySelector('button[type=submit]');
      setLoading(btn, true);

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      setLoading(btn, false);

      if (error) {
        showMsg('login-error', 'البريد أو كلمة المرور غير صحيحة.');
        return;
      }

      const token = data.session?.access_token;
      if (token) {
        localStorage.setItem('mysora_token', token);
        localStorage.setItem('mysora_user_email', email);
        window.location.href = '/chat.html';
      }
    });

    // ---- Sign up ----
    document.getElementById('form-signup').addEventListener('submit', async e => {
      e.preventDefault();
      if (!supabase) return;
      hideMsg('signup-error');
      hideMsg('signup-success');
      const btn = e.target.querySelector('button[type=submit]');
      setLoading(btn, true);

      const display_name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const role = document.getElementById('signup-role').value;

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { display_name, role },
        },
      });
      setLoading(btn, false);

      if (error) {
        showMsg('signup-error', error.message || 'حدث خطأ أثناء إنشاء الحساب.');
        return;
      }

      // If email confirmation is required by Supabase, session will be null
      if (data.session?.access_token) {
        localStorage.setItem('mysora_token', data.session.access_token);
        window.location.href = '/chat.html';
      } else {
        showMsg('signup-success', '✅ تم إنشاء الحساب! تحقق من بريدك الإلكتروني لتأكيد الحساب ثم سجّل الدخول.');
      }
    });

    // ---- Boot ----
    // Redirect if already logged in
    const existingToken = localStorage.getItem('mysora_token');
    if (existingToken) {
      window.location.href = '/chat.html';
    }

    // Load Supabase JS then init
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    script.onload = initSupabase;
    document.head.appendChild(script);
  </script>
</body>
</html>
